# SPDX-License-Identifier: MIT

[package]
name = "columbo"
version = "0.6.0"
edition = "2021"
rust-version = "1.73"
description = "Structurally optimize existing Deflate streams without recompression"
license = "MIT"
readme = false

# Local corpora and reverse-engineering tools are intentionally private. This
# allowlist keeps them out of source packages independently of Git's ignore
# state.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/utils/build-distribution.sh",
    "/utils/sanitize-binary-paths.py",
    "/src/*.rs",
    "/src/**/*.rs",
    "/tests/public_api.rs",
    "/tests/corpus.rs",
]

# Synthetic gzip/zlib/zip inputs for the corpus integration tests. The real
# PNG/text corpus lives outside the source tree (see tests/corpus.rs for the
# override via COLUMBO_CORPUS), so only the encoder for synthetic inputs is
# needed at build time.
[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
flate2 = "1.0"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
# Distribution builds prioritize runtime performance. Full LTO was neutral to
# slightly faster on the representative GZIP and ZIP benchmarks while also
# removing code that cannot be reached.
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "unwind"
strip = true

# Published executables do not expose a recovery boundary for internal panics.
# Aborting there removes the unwinder without changing optimization level or
# normal error handling; developer and library release builds keep unwinding.
[profile.distribution]
inherits = "release"
panic = "abort"
