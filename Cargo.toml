[package]
name = "columbo"
version = "0.9.0"
edition = "2021"
rust-version = "1.73"
description = "Structurally optimize existing Deflate streams without recompression"
license = "MIT"
readme = false

# Local corpora and reverse-engineering tools are private. This allowlist keeps
# them out of source packages regardless of Git's ignore rules.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/rustfmt.toml",
    "/utils/build-distribution.sh",
    "/utils/sanitize-binary-paths.py",
    "/src/*.rs",
    "/src/**/*.rs",
    "/tests/*.rs",
    "/tests/test_sanitize_binary_paths.py",
    "/tests/test_build_distribution.py",
]

[profile.release]
# Release builds favor runtime speed. Full LTO measured neutral to slightly
# faster and removes unreachable code. The CLI has no panic recovery boundary,
# so optimized builds abort on panic, which drops the unwind tables; debug
# builds and test harnesses unwind. `utils/build-distribution.sh` builds the
# distributable executables from this profile.
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = true
